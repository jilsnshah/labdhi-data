# Render Blueprint: API + the two web apps. Postgres is on Neon (free tier);
# its connection string is set as the DATABASE_URL secret, never committed.
#
# Public URLs follow the service names:
#   API      https://labdhi-crm-api.onrender.com   (docs at /docs)
#   Admin    https://labdhi-crm.onrender.com
#   Field    https://labdhi-field.onrender.com     (same bundle as the APK)
# If Render adds a suffix to a taken name, update VITE_API_BASE_URL and
# CORS_ORIGINS below to match.

services:
  - type: web
    name: labdhi-crm-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free instances have no pre-deploy step, so migrate on start. The bootstrap
    # creates only the admin account, and only when the database has no users.
    startCommand: >-
      alembic upgrade head &&
      python -m app.seed --bootstrap &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@tradercrm.in
      - key: SEED_ADMIN_NAME
        value: Trade Desk Admin
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: DISPLAY_TIMEZONE_OFFSET_MINUTES
        value: "330"
      # The two web apps, plus the origins the APK's WebView uses.
      - key: CORS_ORIGINS
        value: https://labdhi-crm.onrender.com,https://labdhi-field.onrender.com,https://localhost,capacitor://localhost
      # Bid links are opened on someone else's phone, so they are built from
      # this and not from whatever host the desk happens to be on.
      - key: PORTAL_BASE_URL
        value: https://labdhi-crm.onrender.com
      # WhatsApp, for sending a bidder their own link when a bid opens. Set in
      # the dashboard, never here. Until both are set nothing is sent: every
      # participant is recorded SKIPPED and the desk copies links by hand.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      # The inbound webhook, at /api/v1/webhooks/whatsapp. The verify token is
      # whatever string is typed into the Meta dashboard beside the URL; the
      # app secret is what every payload is signed with, and without it this
      # deployment accepts nothing inbound at all.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

  - type: web
    name: labdhi-crm
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://labdhi-crm-api.onrender.com/api/v1
    routes:
      # Client-side routing: every path serves the app.
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: labdhi-field
    runtime: static
    rootDir: salesperson-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://labdhi-crm-api.onrender.com/api/v1
